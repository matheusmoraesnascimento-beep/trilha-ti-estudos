name: Deploy Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Falha se houver segredo no repositório
        run: "! grep -rEi 'service_role|eyJ[A-Za-z0-9_-]{30,}\\.[A-Za-z0-9_-]{30,}' --include='*.js' --include='*.html' --include='*.md' . --exclude-dir=node_modules --exclude-dir=.git || (echo 'possível segredo'; exit 1)"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp -r index.html style.css config.js data.js src _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
